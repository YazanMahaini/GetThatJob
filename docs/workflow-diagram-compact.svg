<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2760" role="img" aria-labelledby="title desc">
<title id="title">GetThatJob workflow</title>
<desc id="desc">Eight steps from first-use setup to reusing verified answers in the next application.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#6f95b5" stroke-width="2"/></marker></defs>
<rect width="1610" height="2760" fill="#111111"/>
<path d="M735 360 H875" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1202 640 V760" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M875 1040 H735" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 1320 V1440" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M735 1720 H875" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1202 2000 V2120" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M875 2400 H735" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M80 2400 H35 V360 H80" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="13 13" marker-end="url(#arrow)"/>
<rect x="80" y="80" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="180" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">01  SET UP</text><path d="M125 215 H690" stroke="#355675" stroke-width="3"/><text x="125" y="310" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Ask GetThatJob for help.</text><text x="125" y="376" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">SetupSkill creates your</text><text x="125" y="442" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">workspace on first use.</text><text x="125" y="508" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">SetupChecker finds gaps.</text><rect x="875" y="80" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="920" y="180" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">02  ADD SOURCES</text><path d="M920 215 H1485" stroke="#355675" stroke-width="3"/><text x="920" y="310" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Add CVs, credentials and</text><text x="920" y="376" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">search priorities.</text><text x="920" y="442" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ProfileIntake verifies facts</text><text x="920" y="508" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">and follows your CV style.</text><rect x="875" y="760" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="920" y="860" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">03  FIND JOBS</text><path d="M920 895 H1485" stroke="#355675" stroke-width="3"/><text x="920" y="990" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">JobFinder searches LinkedIn</text><text x="920" y="1056" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Jobs and employer sites.</text><text x="920" y="1122" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">It checks fit and eligibility;</text><text x="920" y="1188" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">you sign in if needed.</text><rect x="80" y="760" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="860" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">04  PREPARE</text><path d="M125 895 H690" stroke="#355675" stroke-width="3"/><text x="125" y="990" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Tailor CV and cover letter.</text><text x="125" y="1056" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Fill and check a portal draft.</text><text x="125" y="1122" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ProfileBuilder saves verified</text><text x="125" y="1188" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">answers for future forms.</text><rect x="80" y="1440" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="1540" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">05  REVIEW</text><path d="M125 1575 H690" stroke="#355675" stroke-width="3"/><text x="125" y="1670" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">You review the draft and</text><text x="125" y="1736" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">request any changes.</text><text x="125" y="1802" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ApplicationFinalize submits</text><text x="125" y="1868" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">only with your direction.</text><rect x="875" y="1440" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="920" y="1540" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">06  CONFIRM</text><path d="M920 1575 H1485" stroke="#355675" stroke-width="3"/><text x="920" y="1670" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">EmailConfirmationChecker</text><text x="920" y="1736" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">looks for a matching receipt</text><text x="920" y="1802" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">and checks portal evidence.</text><rect x="875" y="2120" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="920" y="2220" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">07  TRACK</text><path d="M920 2255 H1485" stroke="#355675" stroke-width="3"/><text x="920" y="2350" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">The tracker and packet</text><text x="920" y="2416" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">record the outcome.</text><text x="920" y="2482" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ApplicationFollowUp checks</text><text x="920" y="2548" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">later status when requested.</text><rect x="80" y="2120" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="2220" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">08  REUSE</text><path d="M125 2255 H690" stroke="#355675" stroke-width="3"/><text x="125" y="2350" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">The next application reads</text><text x="125" y="2416" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">the private, growing profile.</text><text x="125" y="2482" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Scoped or stale facts are</text><text x="125" y="2548" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">rechecked before reuse.</text>
</svg>
