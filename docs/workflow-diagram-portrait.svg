<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 815 5480" role="img" aria-labelledby="title desc">
<title id="title">GetThatJob workflow</title>
<desc id="desc">Eight steps from first-use setup to reusing verified answers in the next application.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#6f95b5" stroke-width="2"/></marker></defs>
<rect width="815" height="5480" fill="#111111"/>
<path d="M407 640 V760" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 1320 V1440" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 2000 V2120" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 2680 V2800" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 3360 V3480" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 4040 V4160" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 4720 V4840" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="80" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="180" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">01  SET UP</text><path d="M125 215 H690" stroke="#355675" stroke-width="3"/><text x="125" y="310" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Ask GetThatJob for help.</text><text x="125" y="376" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">SetupSkill creates your</text><text x="125" y="442" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">workspace on first use.</text><text x="125" y="508" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">SetupChecker finds gaps.</text><rect x="80" y="760" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="860" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">02  ADD SOURCES</text><path d="M125 895 H690" stroke="#355675" stroke-width="3"/><text x="125" y="990" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Add CVs, credentials and</text><text x="125" y="1056" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">search priorities.</text><text x="125" y="1122" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ProfileIntake verifies facts</text><text x="125" y="1188" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">and follows your CV style.</text><rect x="80" y="1440" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="1540" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">03  FIND JOBS</text><path d="M125 1575 H690" stroke="#355675" stroke-width="3"/><text x="125" y="1670" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">JobFinder searches LinkedIn</text><text x="125" y="1736" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Jobs and employer sites.</text><text x="125" y="1802" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">It checks fit and eligibility;</text><text x="125" y="1868" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">you sign in if needed.</text><rect x="80" y="2120" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="2220" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">04  PREPARE</text><path d="M125 2255 H690" stroke="#355675" stroke-width="3"/><text x="125" y="2350" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Tailor CV and cover letter.</text><text x="125" y="2416" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Fill and check a portal draft.</text><text x="125" y="2482" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ProfileBuilder saves verified</text><text x="125" y="2548" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">answers for future forms.</text><rect x="80" y="2800" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="2900" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">05  REVIEW</text><path d="M125 2935 H690" stroke="#355675" stroke-width="3"/><text x="125" y="3030" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">You review the draft and</text><text x="125" y="3096" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">request any changes.</text><text x="125" y="3162" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ApplicationFinalize submits</text><text x="125" y="3228" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">only with your direction.</text><rect x="80" y="3480" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="3580" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">06  CONFIRM</text><path d="M125 3615 H690" stroke="#355675" stroke-width="3"/><text x="125" y="3710" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">EmailConfirmationChecker</text><text x="125" y="3776" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">looks for a matching receipt</text><text x="125" y="3842" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">and checks portal evidence.</text><rect x="80" y="4160" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="4260" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">07  TRACK</text><path d="M125 4295 H690" stroke="#355675" stroke-width="3"/><text x="125" y="4390" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">The tracker and packet</text><text x="125" y="4456" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">record the outcome.</text><text x="125" y="4522" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ApplicationFollowUp checks</text><text x="125" y="4588" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">later status when requested.</text><rect x="80" y="4840" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="4940" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">08  REUSE</text><path d="M125 4975 H690" stroke="#355675" stroke-width="3"/><text x="125" y="5070" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">The next application reads</text><text x="125" y="5136" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">the private, growing profile.</text><text x="125" y="5202" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Scoped or stale facts are</text><text x="125" y="5268" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">rechecked before reuse.</text>
</svg>
