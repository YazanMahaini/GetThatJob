<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 1600" role="img" aria-labelledby="title desc">
<title id="title">GetThatJob workflow</title>
<desc id="desc">Eight steps from first-use setup to reusing verified answers in the next application.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#6f95b5" stroke-width="2"/></marker></defs>
<rect width="3200" height="1600" fill="#111111"/>
<path d="M735 410 H875" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1530 410 H1670" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M2325 410 H2465" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M2792 690 V910" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M2465 1190 H2325" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1670 1190 H1530" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M875 1190 H735" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M80 1190 H35 V410 H80" fill="none" stroke="#6f95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="13 13" marker-end="url(#arrow)"/>
<rect x="80" y="130" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="230" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">01  SET UP</text><path d="M125 265 H690" stroke="#355675" stroke-width="3"/><text x="125" y="360" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Ask GetThatJob for help.</text><text x="125" y="426" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">SetupSkill creates your</text><text x="125" y="492" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">workspace on first use.</text><text x="125" y="558" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">SetupChecker finds gaps.</text><rect x="875" y="130" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="920" y="230" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">02  ADD SOURCES</text><path d="M920 265 H1485" stroke="#355675" stroke-width="3"/><text x="920" y="360" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Add CVs, credentials and</text><text x="920" y="426" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">search priorities.</text><text x="920" y="492" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ProfileIntake verifies facts</text><text x="920" y="558" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">and follows your CV style.</text><rect x="1670" y="130" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="1715" y="230" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">03  FIND JOBS</text><path d="M1715 265 H2280" stroke="#355675" stroke-width="3"/><text x="1715" y="360" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">JobFinder searches LinkedIn</text><text x="1715" y="426" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Jobs and employer sites.</text><text x="1715" y="492" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">It checks fit and eligibility;</text><text x="1715" y="558" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">you sign in if needed.</text><rect x="2465" y="130" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="2510" y="230" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">04  PREPARE</text><path d="M2510 265 H3075" stroke="#355675" stroke-width="3"/><text x="2510" y="360" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Tailor CV and cover letter.</text><text x="2510" y="426" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Fill and check a portal draft.</text><text x="2510" y="492" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ProfileBuilder saves verified</text><text x="2510" y="558" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">answers for future forms.</text><rect x="2465" y="910" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="2510" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">05  REVIEW</text><path d="M2510 1045 H3075" stroke="#355675" stroke-width="3"/><text x="2510" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">You review the draft and</text><text x="2510" y="1206" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">request any changes.</text><text x="2510" y="1272" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ApplicationFinalize submits</text><text x="2510" y="1338" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">only with your direction.</text><rect x="1670" y="910" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="1715" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">06  CONFIRM</text><path d="M1715 1045 H2280" stroke="#355675" stroke-width="3"/><text x="1715" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">EmailConfirmationChecker</text><text x="1715" y="1206" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">looks for a matching receipt</text><text x="1715" y="1272" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">and checks portal evidence.</text><rect x="875" y="910" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="920" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">07  TRACK</text><path d="M920 1045 H1485" stroke="#355675" stroke-width="3"/><text x="920" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">The tracker and packet</text><text x="920" y="1206" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">record the outcome.</text><text x="920" y="1272" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">ApplicationFollowUp checks</text><text x="920" y="1338" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">later status when requested.</text><rect x="80" y="910" width="655" height="560" rx="45" fill="#00182f" stroke="#355675" stroke-width="4"/><text x="125" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#70b5f3">08  REUSE</text><path d="M125 1045 H690" stroke="#355675" stroke-width="3"/><text x="125" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">The next application reads</text><text x="125" y="1206" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">the private, growing profile.</text><text x="125" y="1272" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">Scoped or stale facts are</text><text x="125" y="1338" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#d9e8f6">rechecked before reuse.</text>
</svg>
